<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>敏感图片检测器</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="image-styles.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1><i class="fas fa-image"></i> 敏感图片检测器</h1>
            <p class="subtitle">通过OCR技术智能提取图片中的文本，并可视化敏感信息</p>
        </header>

        <main class="main-content">
            <div class="input-section" id="file-input-section">
                <div class="file-upload-area" id="file-upload-area">
                    <div class="upload-content">
                        <i class="fas fa-cloud-upload-alt"></i>
                        <p>拖拽图片到此处或点击选择文件</p>
                        <p class="file-info">支持 .png, .jpg, .webp 格式，最大 10MB</p>
                        <input type="file" id="file-input" accept="image/png,image/jpeg,image/webp" hidden>
                    </div>
                    <div class="file-selected hidden" id="file-selected">
                        <i class="fas fa-file-image"></i>
                        <span class="file-name" id="file-name"></span>
                        <button class="remove-file" id="remove-file">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                </div>
                <button class="detect-btn" id="file-detect-btn" disabled>
                    <i class="fas fa-search"></i>
                    开始检测
                </button>
            </div>

            <div class="image-preview-section hidden" id="image-preview-section">
                <h3><i class="fas fa-eye"></i> 图片预览</h3>
                <div class="image-preview-container">
                    <img id="image-preview" src="#" alt="Image Preview">
                </div>
            </div>

            <div class="detection-options">
                <h3>检测类型选择：</h3>
                <div class="option-group">
                    <label class="option-item">
                        <input type="checkbox" value="PersonName" checked>
                        <span class="checkmark"></span>
                        <i class="fas fa-user"></i>
                        人名
                    </label>
                    <label class="option-item">
                        <input type="checkbox" value="PhoneNumber" checked>
                        <span class="checkmark"></span>
                        <i class="fas fa-phone"></i>
                        手机号
                    </label>
                    <label class="option-item">
                        <input type="checkbox" value="IDCard" checked>
                        <span class="checkmark"></span>
                        <i class="fas fa-id-card"></i>
                        身份证
                    </label>
                    <label class="option-item">
                        <input type="checkbox" value="Address" checked>
                        <span class="checkmark"></span>
                        <i class="fas fa-map-marker-alt"></i>
                        地址
                    </label>
                    <label class="option-item">
                        <input type="checkbox" value="BankCard" checked>
                        <span class="checkmark"></span>
                        <i class="fas fa-credit-card"></i>
                        银行卡号
                    </label>
                    <label class="option-item">
                        <input type="checkbox" value="Email" checked>
                        <span class="checkmark"></span>
                        <i class="fas fa-envelope"></i>
                        邮箱地址
                    </label>
                </div>
            </div>

            <div class="loading hidden" id="loading">
                <div class="spinner"></div>
                <p>正在识别和检测中，请稍候...</p>
            </div>

            <div class="results-section hidden" id="results-section">
                <div class="results-header">
                    <h2><i class="fas fa-chart-bar"></i> 检测结果</h2>
                    <div class="results-stats" id="results-stats"></div>
                </div>
                
                <div class="results-content" id="results-content">
                    <div class="results-tab-nav">
                        <button class="tab-btn active" data-tab="visual">
                            <i class="fas fa-paint-brush"></i> 可视化结果
                        </button>
                        <button class="tab-btn" data-tab="text">
                            <i class="fas fa-file-alt"></i> 提取文本
                        </button>
                    </div>

                    <div class="tab-content active" id="visual-tab">
                        <p class="tab-description">在下方图片中，已为您标出识别到的敏感信息位置。</p>
                        <div class="visual-result-container" id="visual-result-container">
                            <img id="result-image" src="#" alt="Result Image">
                            </div>
                    </div>

                    <div class="tab-content" id="text-tab">
                        <p class="tab-description">下方是图片中识别出的全部文本内容。</p>
                        <div class="ocr-text-container" id="ocr-text-container">
                        </div>
                    </div>
                </div>

                <div class="results-actions">
                    <button class="action-btn" id="export-btn">
                        <i class="fas fa-download"></i>
                        导出结果
                    </button>
                    <button class="action-btn secondary" id="clear-btn">
                        <i class="fas fa-trash"></i>
                        清空结果
                    </button>
                </div>
            </div>

            <div class="error-message hidden" id="error-message">
                <i class="fas fa-exclamation-triangle"></i>
                <span id="error-text"></span>
                <button class="close-error" id="close-error">
                    <i class="fas fa-times"></i>
                </button>
            </div>
        </main>

        <footer class="footer">
            <p>&copy; 2024 敏感数据检测器. 基于纯Go语言和自研NLP/OCR技术构建</p>
        </footer>
    </div>

    <script src="image-script.js"></script>
</body>
</html>
