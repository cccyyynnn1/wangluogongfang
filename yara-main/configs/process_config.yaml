# 进程管理器配置
process_manager:
  # 并发控制
  workers: 10                    # 并发工作线程数
  
  # 超时配置（秒）
  timeouts:
    process: 10                  # 标准进程信息获取超时
    fast: 3                     # 快速超时（降级策略）
    ultra_fast: 1               # 超快速超时（最后降级）
  
  # 缓存配置
  cache:
    duration: 30                 # 缓存持续时间（秒）
    max_processes: 1000         # 最大缓存进程数
  
  # 错误处理
  error_handling:
    max_errors_log: 30          # 最大错误日志数量
    error_reset_interval: 300   # 错误统计重置间隔（秒）
  
  # 批处理配置
  batch:
    size: 50                    # 批处理大小
    delay: 100                  # 批次间延迟（毫秒）
  
  # 降级策略
  fallback:
    enabled: true               # 启用降级策略
    max_retries: 2             # 最大重试次数
    retry_delay: 100           # 重试延迟（毫秒）
  
  # 性能监控
  monitoring:
    enabled: true               # 启用性能监控
    metrics_interval: 60        # 指标收集间隔（秒）
    health_check_interval: 30   # 健康检查间隔（秒）
